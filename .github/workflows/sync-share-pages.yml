name: Sync Song Share Pages (WhatsApp OG)

on:
  push:
    branches: [main]
    paths:
      - 'playlist.js'
      - 'assets/**'
      - '!assets/og/**'
      - 'scripts/generate-share-pages.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-share-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate per-song share pages & OG covers
        run: node scripts/generate-share-pages.mjs

      - name: Commit updated share pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html song/ assets/og/
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-sync song share pages & OG metadata"
            git push
          else
            echo "No changes to share pages."
          fi
